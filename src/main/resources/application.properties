spring.application.name=hackhub
server.port=${PORT:8085}

# ============================================================
# HTTP Performance & GZIP Compression
# ============================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=512

# ============================================================
# Database Configuration (Supports Local MySQL & Cloud Environment Overrides: Aiven, Neon, Supabase)
# If DB_DRIVER is not explicitly provided, HikariCP/Spring Boot auto-detects MySQL vs PostgreSQL from the JDBC URL prefix.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hackhub_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:hackhub2026}
spring.datasource.driver-class-name=${DB_DRIVER:}

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Connection Pool (HikariCP — Optimized for 512MB RAM Container)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Properties (Auto-detects dialect for MySQL & H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Upload Properties
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/posters

# Brevo (Sendinblue) Transactional Email API Configuration
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:libineshr7@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:HackHub Security Team}
hackhub.app.url=${APP_URL:https://hackhub-h1uf.onrender.com}

# Fallback Mail Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:hr.zohoprivatelimited@gmail.com}
spring.mail.password=${MAIL_PASSWORD:iifqgcjpwpcrduqz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# JWT Secret & Expiration
hackhub.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
hackhub.jwt.expiration-ms=86400000
